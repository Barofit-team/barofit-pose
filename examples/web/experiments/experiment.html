<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Barofit · 운동 테스트</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="plank.css"></head>
<body><header class="top"><a class="brand" href="./"><span class="mark">b.</span> barofit <span class="lab">REPLAY LAB</span></a><label>운동 선택 <select id="exercise" aria-label="운동 선택"><option value="pushup">푸시업</option><option value="plank">플랭크</option><option value="squat">스쿼트 · 실험</option><option value="bird_dog">버드독 · 실험</option></select></label><a href="guide.html">데모·검증 범위</a></header>
<main><section class="intro"><div><p class="eyebrow">EXPERIMENT / MOVEMENT LAB</p><h1 id="title">운동 테스트</h1><p id="description"></p></div></section>
<div id="notice" class="notice" role="status" hidden></div>
<section class="workspace"><div class="viewer-column"><div class="panel viewer"><div class="panel-head"><strong id="file-title">영상 선택</strong><span id="mode-label">READY</span></div>
<div class="stage"><video id="video" playsinline muted preload="metadata"></video><canvas id="overlay"></canvas><label class="empty" id="empty" for="file"><span class="upload-icon">↥</span><strong>측면 영상을 선택하세요</strong><span class="upload-pill">내 기기에서 영상 가져오기</span><small>영상은 서버로 전송하지 않습니다.</small></label></div>
<div class="transport"><span id="clock">0.0 / 0.0초</span><input id="seek" type="range" min="0" max="1" step=".05" value="0" aria-label="영상 위치" disabled><span>1×</span></div>
<div class="toolbar"><button id="start" class="primary" disabled>▶ 분석 시작</button><button id="pause" disabled>일시정지</button><button id="finish" disabled>세트 종료</button><label for="file" class="button subtle">영상 변경</label><input id="file" type="file" accept="video/*" hidden></div></div>
<div class="panel settings"><div class="setting"><span><strong>분석 구간</strong><small id="preparation"></small></span><div class="range-fields"><label>시작 <input id="from" type="number" value="0" min="0" step=".1" disabled>초</label><label>끝 <input id="to" type="number" value="0" min="0" step=".1" disabled>초</label></div></div>
<div class="setting"><label for="voice"><strong>음성 코칭</strong><small>기기 한국어 음성 · 같은 경고 10초 / 안내 사이 6초</small></label><input id="voice" type="checkbox" role="switch"></div>
<div class="setting"><label for="record-full"><strong>전체 분석 영상도 저장</strong><small>분석 중 뼈대와 경고를 무음 영상으로 기록</small></label><input id="record-full" type="checkbox" checked role="switch"></div>
<div class="setting"><label for="bones"><strong>관절 표시</strong></label><input id="bones" type="checkbox" checked role="switch"></div></div>
<p class="privacy-note">분석 결과는 탭 안에만 보관됩니다. 페이지를 이동하기 전에 저장하세요.</p></div>
<aside class="coach-column"><div class="panel count-panel"><p class="eyebrow" id="exercise-label"></p><div class="count"><span id="count">0</span><small id="unit">회</small></div><span class="tracking" id="tracking">영상 선택 대기</span><p id="phase" class="muted">동작 단계 대기</p><p class="muted" id="count-note"></p><div class="mini-stats"><div><span>분석 속도</span><strong id="fps">— FPS</strong></div><div><span>관측 쪽</span><strong id="side">—</strong></div></div></div>
<div class="panel coach"><div class="panel-head"><span>실시간 피드백</span><span id="sound">음성 꺼짐</span></div><h2 id="feedback-title">동작을 기다리고 있어요</h2><p id="feedback"></p></div>
<div class="panel plank-items" id="live-items"></div></aside></section>
<section class="panel results" id="results" hidden><div class="results-head"><div><p class="eyebrow">SET REVIEW</p><h2>이번 분석 결과</h2><p id="summary-copy"></p></div><div class="downloads"><button id="json">결과 JSON</button><button id="zip" class="primary">전체 결과 ZIP</button></div></div>
<p id="full-status" class="muted"></p><div id="item-cards" class="item-cards"></div><h3>검증 메모</h3><textarea id="memo" placeholder="영상 시각과 잘못된 횟수·경고를 적어주세요. (선택)"></textarea><details><summary>상세 결과</summary><pre id="summary-detail"></pre></details></section>
<footer><span>BAROFIT / MOVEMENT LAB</span><span id="model-state">분석 모델 준비 중…</span></footer></main><script type="module" src="experiment-app.js"></script><script type="module" src="sample-loader.js"></script></body></html>
